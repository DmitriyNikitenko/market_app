server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/users/**
        - id: catalog-service
          uri: http://catalog-service:8083
          predicates:
            - Path=/api/menu/**, /api/products/**
        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/v1/cart/**, /api/v1/checkout/**

jwt:
  secret: ${JWT_SECRET}